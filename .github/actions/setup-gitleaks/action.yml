name: Setup gitleaks
description: Installs a pinned gitleaks release after checking it against the release checksums.
inputs:
  version:
    description: gitleaks version, without the leading v
    required: false
    default: "8.30.1"
runs:
  using: composite
  steps:
    - name: Download, verify and install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        workdir="$(mktemp -d)"
        curl -fsSL -o "$workdir/$archive" "$base/$archive"
        curl -fsSL -o "$workdir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        (cd "$workdir" && grep " ${archive}\$" checksums.txt | sha256sum --check --strict)
        tar -xzf "$workdir/$archive" -C "$workdir" gitleaks
        sudo install -m 0755 "$workdir/gitleaks" /usr/local/bin/gitleaks
        gitleaks version
